name: Deploy 13Xplay to Hostinger

on:
  push:
    branches:
      - 13xplay-theme-sync

concurrency:
  group: deploy-13xplay-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy 13Xplay theme files to real wp-content folder
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /wp-content/themes/13xplay/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            tools/**
            README.md

      - name: Upload standalone Elementor repair to website root
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "tools/x13-elementor-repair.php" \
            "ftp://${FTP_SERVER}/x13-elementor-repair.php"

      - name: Execute and verify Elementor repair
        run: |
          sleep 2
          echo "Standalone Elementor repair result:"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "https://13xplay.upscaleera.com/x13-elementor-repair.php?token=x13-repair-28-20260814"
          echo

      - name: Remove standalone repair file from Hostinger
        if: always()
        run: |
          curl --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --quote "DELE x13-elementor-repair.php" \
            "ftp://${FTP_SERVER}/" > /dev/null || true
