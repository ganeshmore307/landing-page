name: Deploy 13Xplay to Hostinger

on:
  push:
    branches:
      - 13xplay-theme-sync

concurrency:
  group: deploy-13xplay-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy 13Xplay theme files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /wp-content/themes/13xplay/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            tools/**
            README.md

      - name: Upload temporary Elementor MU repair
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "tools/x13-elementor-mu-repair.php" \
            "ftp://${FTP_SERVER}/wp-content/mu-plugins/x13-elementor-repair.php"

      - name: Execute and verify Elementor document repair
        run: |
          sleep 2
          echo "Elementor repair verification:"
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            "https://13xplay.upscaleera.com/?x13_force_elementor_repair=1&cb=${GITHUB_SHA}"
          echo

      - name: Remove temporary Elementor MU repair
        if: always()
        run: |
          curl --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --quote "DELE wp-content/mu-plugins/x13-elementor-repair.php" \
            "ftp://${FTP_SERVER}/" > /dev/null || true
