name: Build 13Xplay Elementor Landing Page

on:
  push:
    branches:
      - 13xplay-theme-sync

concurrency:
  group: build-13xplay-elementor
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload temporary Elementor layout builder
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "tools/x13-build-reference-layout.php" \
            "ftp://${FTP_SERVER}/wp-content/mu-plugins/x13-build-reference-layout.php"

      - name: Build and verify Elementor landing page
        run: |
          sleep 2
          echo "13Xplay Elementor layout result:"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://13xplay.upscaleera.com/?x13_build_reference=1&cb=${GITHUB_SHA}"
          echo

      - name: Verify live Home contains new layout markers
        run: |
          sleep 2
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://13xplay.upscaleera.com/?cb=${GITHUB_SHA}" \
            | grep -E "x13-ref-header|x13-main-title|x13-main-whatsapp|x13-ref-footer" >/dev/null
          echo "Live Home contains header, hero CTA and footer markers."

      - name: Remove temporary Elementor layout builder
        if: always()
        run: |
          curl --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --quote "DELE wp-content/mu-plugins/x13-build-reference-layout.php" \
            "ftp://${FTP_SERVER}/" > /dev/null || true
