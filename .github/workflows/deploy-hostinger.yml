name: Deploy 13Xplay Controlled Elementor Landing

on:
  push:
    branches:
      - 13xplay-theme-sync

concurrency:
  group: deploy-13xplay-controlled-editor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare 13Xplay artwork assets
        run: |
          mkdir -p /tmp/x13-assets
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/7f851c41d70033654cfcc67df92f78147d3c6641" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/x13-assets/13xplay-logo.webp
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/bdc74f286880483934ea67b3f2cbb96845efd640" \
            | jq -r '.content' | tr -d '\n' | base64 -d > /tmp/x13-assets/13xplay-hero.webp
          test -s /tmp/x13-assets/13xplay-logo.webp
          test -s /tmp/x13-assets/13xplay-hero.webp

      - name: Upload branded artwork
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file /tmp/x13-assets/13xplay-logo.webp \
            "ftp://${FTP_SERVER}/wp-content/uploads/13xplay-assets/13xplay-logo.webp"
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file /tmp/x13-assets/13xplay-hero.webp \
            "ftp://${FTP_SERVER}/wp-content/uploads/13xplay-assets/13xplay-hero.webp"

      - name: Upload persistent controlled Elementor editor
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "tools/x13-controlled-elementor-widget.php" \
            "ftp://${FTP_SERVER}/wp-content/mu-plugins/x13-controlled-elementor-widget.php"

      - name: Upload persistent mobile reference polish
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "tools/x13-mobile-reference-polish.php" \
            "ftp://${FTP_SERVER}/wp-content/mu-plugins/x13-mobile-reference-polish.php"

      - name: Upload one-time Home seeder
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --upload-file "tools/x13-seed-controlled-editor.php" \
            "ftp://${FTP_SERVER}/wp-content/mu-plugins/x13-seed-controlled-editor.php"

      - name: Seed Home 28 with controlled widget and reference trust points
        run: |
          sleep 2
          echo "Controlled editor seed result:"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://13xplay.upscaleera.com/?x13_seed_controlled=1&cb=${GITHUB_SHA}"
          echo

      - name: Verify premium layout and mobile polish live
        run: |
          sleep 2
          HTML="$(curl --fail --silent --show-error --location --retry 3 --max-time 60 "https://13xplay.upscaleera.com/?cb=${GITHUB_SHA}")"
          echo "$HTML" | grep -E "x13-fixed|x13-main-wa|x13-feature-strip|x13-footer|x13-mobile-reference-polish" >/dev/null
          echo "$HTML" | grep -E "FAST|DELIVERY|100%|SECURE|24/7|SUPPORT|BEST|SERVICE" >/dev/null
          curl --fail --silent --show-error --head "https://13xplay.upscaleera.com/wp-content/uploads/13xplay-assets/13xplay-logo.webp" >/dev/null
          curl --fail --silent --show-error --head "https://13xplay.upscaleera.com/wp-content/uploads/13xplay-assets/13xplay-hero.webp" >/dev/null
          echo "Desktop preserved, mobile reference polish and trust points verified live."

      - name: Remove one-time seeder only
        if: always()
        run: |
          curl --silent --show-error \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            --quote "DELE wp-content/mu-plugins/x13-seed-controlled-editor.php" \
            "ftp://${FTP_SERVER}/" > /dev/null || true
